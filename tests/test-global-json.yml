name: Test install from global.json file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create global.json in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/gj-test"
          cat > "$GITHUB_WORKSPACE/gj-test/global.json" <<'EOF'
          {
            "sdk": {
              "version": "8.0.404"
            }
          }
          EOF
          cat "$GITHUB_WORKSPACE/gj-test/global.json"
      - id: action
        uses: .
        with:
          global-json-file: gj-test/global.json
          skip-lts-prepass: 'true'
      - name: Assert dotnet-version output matches global.json
        env:
          ACTUAL: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "8.0.404" ]; then
            echo "FAIL: expected '8.0.404'"
            exit 1
          fi
          echo "PASS"
      - name: Assert SDK is installed
        run: |
          dotnet --list-sdks
          if ! dotnet --list-sdks | grep -q "^8.0.404 "; then
            echo "FAIL: SDK 8.0.404 not installed"
            exit 1
          fi
          echo "PASS"
