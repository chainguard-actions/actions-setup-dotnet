name: Test dotnet setup with global.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create global.json fixture
        run: |
          mkdir -p $GITHUB_WORKSPACE/pristine/actions--setup-dotnet/v5.2.0/tests/fixtures
          cat > /tmp/global.json <<'EOF'
          {
            "sdk": {
              "version": "8.0.100",
              "rollForward": "latestMinor"
            }
          }
          EOF
          echo "Created global.json:"
          cat /tmp/global.json
      - id: setup
        uses: .
        with:
          global-json-file: '/tmp/global.json'
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet is available and version matches global.json
        run: |
          if ! command -v dotnet &>/dev/null; then
            echo "FAIL: dotnet not found on PATH"
            exit 1
          fi
          VERSION=$(dotnet --version)
          echo "Installed dotnet version: $VERSION"
          if [[ "$VERSION" != 8.* ]]; then
            echo "FAIL: expected version starting with 8., got $VERSION"
            exit 1
          fi
          echo "PASS: dotnet $VERSION matches global.json major version 8"
