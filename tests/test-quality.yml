name: Test dotnet setup with quality input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          dotnet-version: '9.0.x'
          dotnet-quality: 'ga'
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet is available on PATH
        run: |
          if ! command -v dotnet &> /dev/null; then
            echo "FAIL: dotnet command not found on PATH"
            exit 1
          fi
          INSTALLED=$(dotnet --version)
          echo "dotnet version: $INSTALLED"
          echo "PASS: dotnet is available"
      - name: Assert installed version matches requested major
        run: |
          INSTALLED=$(dotnet --version)
          echo "installed: $INSTALLED"
          if [[ "$INSTALLED" != 9.* ]]; then
            echo "FAIL: expected version starting with 9., got $INSTALLED"
            exit 1
          fi
          echo "PASS"
