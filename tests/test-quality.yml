name: Test dotnet setup with quality
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: '8.0.x'
          dotnet-quality: 'ga'
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet is installed and is a GA release
        run: |
          if ! command -v dotnet &>/dev/null; then
            echo "FAIL: dotnet command not found"
            exit 1
          fi
          INSTALLED="$(dotnet --version)"
          echo "dotnet --version: $INSTALLED"
          # GA releases should not contain preview or rc suffixes
          if echo "$INSTALLED" | grep -qiE '(preview|rc|alpha|beta)'; then
            echo "FAIL: expected GA release but got pre-release version: $INSTALLED"
            exit 1
          fi
          echo "PASS: installed version $INSTALLED appears to be a GA release"
