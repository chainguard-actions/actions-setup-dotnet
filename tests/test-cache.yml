name: Test dotnet setup with cache enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: '8.0.x'
          cache: true
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert cache-hit output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "actual cache-hit output: $ACTUAL"
          # cache-hit should be either 'true' or 'false' (not empty)
          if [ -z "$ACTUAL" ]; then
            echo "WARN: cache-hit output is empty (may be expected in act environment)"
          else
            if [ "$ACTUAL" != "true" ] && [ "$ACTUAL" != "false" ]; then
              echo "FAIL: cache-hit should be 'true' or 'false', got: $ACTUAL"
              exit 1
            fi
            echo "PASS: cache-hit output is '$ACTUAL'"
          fi
      - name: Assert dotnet is installed
        run: |
          if ! command -v dotnet &>/dev/null; then
            echo "FAIL: dotnet command not found"
            exit 1
          fi
          echo "dotnet --version: $(dotnet --version)"
          echo "PASS: dotnet is installed"
