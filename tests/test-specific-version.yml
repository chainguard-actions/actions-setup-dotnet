name: Test specific dotnet patch version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: '6.0.x'
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet 6.x is installed
        run: |
          echo "Checking dotnet 6.x installation..."
          INSTALLED_VERSION=$(dotnet --version)
          echo "Installed dotnet version: $INSTALLED_VERSION"
          if [[ "$INSTALLED_VERSION" != 6.* ]]; then
            echo "FAIL: expected dotnet 6.x but got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: dotnet 6.x is installed"
