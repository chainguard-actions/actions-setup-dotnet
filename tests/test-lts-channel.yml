name: Test dotnet install with LTS channel
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: 'latest'
          dotnet-channel: 'LTS'
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet is installed and functional
        run: |
          echo "Checking dotnet installation via LTS channel..."
          if ! command -v dotnet &>/dev/null; then
            echo "FAIL: dotnet command not found"
            exit 1
          fi
          INSTALLED_VERSION=$(dotnet --version)
          echo "Installed dotnet version: $INSTALLED_VERSION"
          if [ -z "$INSTALLED_VERSION" ]; then
            echo "FAIL: dotnet --version returned empty"
            exit 1
          fi
          echo "PASS: dotnet LTS version installed: $INSTALLED_VERSION"
