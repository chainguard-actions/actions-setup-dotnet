name: Test multiple dotnet versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet is installed
        run: |
          if ! command -v dotnet &>/dev/null; then
            echo "FAIL: dotnet command not found"
            exit 1
          fi
          echo "dotnet --version: $(dotnet --version)"
          echo "PASS: dotnet is installed"
      - name: Assert both SDK versions are available
        run: |
          echo "Listing installed SDKs:"
          dotnet --list-sdks
          SDK_LIST="$(dotnet --list-sdks)"
          if ! echo "$SDK_LIST" | grep -q "^6\."; then
            echo "FAIL: .NET 6 SDK not found in installed SDKs"
            echo "Installed SDKs: $SDK_LIST"
            exit 1
          fi
          if ! echo "$SDK_LIST" | grep -q "^8\."; then
            echo "FAIL: .NET 8 SDK not found in installed SDKs"
            echo "Installed SDKs: $SDK_LIST"
            exit 1
          fi
          echo "PASS: both .NET 6 and .NET 8 SDKs are installed"
