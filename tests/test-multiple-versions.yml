name: Test multiple dotnet versions setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet is available on PATH
        run: |
          if ! command -v dotnet &>/dev/null; then
            echo "FAIL: dotnet not found on PATH"
            exit 1
          fi
          echo "PASS: dotnet found at $(command -v dotnet)"
      - name: Assert both SDK versions are installed
        run: |
          echo "Listing installed SDKs:"
          dotnet --list-sdks
          SDKS=$(dotnet --list-sdks)
          if ! echo "$SDKS" | grep -q "^6\."; then
            echo "FAIL: .NET 6 SDK not found in installed SDKs"
            exit 1
          fi
          if ! echo "$SDKS" | grep -q "^8\."; then
            echo "FAIL: .NET 8 SDK not found in installed SDKs"
            exit 1
          fi
          echo "PASS: both .NET 6 and .NET 8 SDKs are installed"
