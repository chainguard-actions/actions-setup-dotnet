name: Test cache-dependency-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4
      - name: Create externals/install-dotnet.sh
        run: |
          mkdir -p __ACTION_SRC__/externals
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o __ACTION_SRC__/externals/install-dotnet.sh
          chmod 755 __ACTION_SRC__/externals/install-dotnet.sh
      - name: Create a packages.lock.json for cache dependency
        run: |
          mkdir -p myapp
          cat > myapp/packages.lock.json <<'EOF'
          {
            "version": 1,
            "dependencies": {
              "net8.0": {}
            }
          }
          EOF
          echo "Created myapp/packages.lock.json"
      - id: setup
        uses: .
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: myapp/packages.lock.json
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cache-hit output is present
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # cache-hit can be true or false (or empty on first run), just verify dotnet works
          dotnet --version
          echo "PASS: dotnet is available and cache-dependency-path was accepted"
