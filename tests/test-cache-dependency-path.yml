name: Test NuGet cache with cache-dependency-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a packages.lock.json
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cache-test"
          cat > "$GITHUB_WORKSPACE/cache-test/packages.lock.json" <<'EOF'
          {
            "version": 1,
            "dependencies": {
              "net8.0": {}
            }
          }
          EOF
      - id: action
        uses: .
        with:
          dotnet-version: '8.0.x'
          skip-lts-prepass: 'true'
          cache: 'true'
          cache-dependency-path: cache-test/packages.lock.json
      - name: Assert cache-hit output is a boolean
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit }}
          VERSION: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "cache-hit: $ACTUAL"
          echo "version: $VERSION"
          case "$ACTUAL" in
            true|false) echo "PASS" ;;
            *) echo "FAIL: expected cache-hit to be true or false"; exit 1 ;;
          esac
          case "$VERSION" in
            8.0.*) echo "PASS" ;;
            *) echo "FAIL: expected an 8.0.x version"; exit 1 ;;
          esac
      - name: Ensure global-packages folder exists for post cache save
        run: |
          P="$(dotnet nuget locals global-packages --list | sed -E 's/^[^:]*:[[:space:]]*//')"
          echo "global-packages: $P"
          mkdir -p "$P"
          echo placeholder > "$P/.placeholder"
          ls -la "$P"
