name: Test cache-dependency-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake packages.lock.json for cache key
        run: |
          mkdir -p hardened/tests/fixtures/cache
          cat > hardened/tests/fixtures/cache/packages.lock.json <<'EOF'
          {
            "version": 1,
            "dependencies": {}
          }
          EOF
      - id: action
        uses: .
        with:
          dotnet-version: '8.0'
          cache: true
          cache-dependency-path: 'hardened/tests/fixtures/cache/packages.lock.json'
      - name: Assert dotnet is installed
        env:
          DOTNET_VER: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "dotnet-version output: $DOTNET_VER"
          if ! dotnet --version; then
            echo "FAIL: dotnet not found"
            exit 1
          fi
          echo "PASS: dotnet installed with cache-dependency-path"
