name: Test source-url and owner inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: '8.0'
          source-url: 'https://nuget.pkg.github.com/actions/index.json'
          owner: 'actions'
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
      - name: Assert dotnet-version output is set
        env:
          DOTNET_VER: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "dotnet-version: $DOTNET_VER"
          if [ -z "$DOTNET_VER" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert dotnet is available
        run: |
          dotnet --version
          echo "PASS: dotnet is available"
