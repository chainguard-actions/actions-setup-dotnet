name: Test source-url and owner inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: '8.0'
          source-url: 'https://nuget.pkg.github.com/actions/index.json'
          owner: 'actions'
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
      - name: Assert dotnet is installed
        env:
          DOTNET_VER: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "dotnet-version output: $DOTNET_VER"
          if ! dotnet --version; then
            echo "FAIL: dotnet not found"
            exit 1
          fi
          echo "PASS: dotnet installed with source-url and owner"
