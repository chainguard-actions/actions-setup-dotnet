name: Test basic dotnet setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: '8.0.x'
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet is installed and executable
        run: |
          echo "Checking dotnet binary..."
          if ! command -v dotnet &>/dev/null; then
            echo "FAIL: dotnet command not found"
            exit 1
          fi
          INSTALLED="$(dotnet --version)"
          echo "dotnet --version: $INSTALLED"
          echo "PASS: dotnet is installed"
      - name: Assert installed version matches requested major
        run: |
          INSTALLED="$(dotnet --version)"
          echo "Installed version: $INSTALLED"
          if [[ "$INSTALLED" != 8.* ]]; then
            echo "FAIL: expected version starting with 8., got $INSTALLED"
            exit 1
          fi
          echo "PASS: installed version $INSTALLED starts with 8."
