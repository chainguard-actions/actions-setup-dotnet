name: Test basic dotnet setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          dotnet-version: '8.0.x'
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet is available on PATH
        run: |
          echo "Checking dotnet is on PATH..."
          if ! command -v dotnet &>/dev/null; then
            echo "FAIL: dotnet not found on PATH"
            exit 1
          fi
          echo "PASS: dotnet found at $(command -v dotnet)"
      - name: Assert installed dotnet version matches requested major
        run: |
          VERSION=$(dotnet --version)
          echo "Installed dotnet version: $VERSION"
          if [[ "$VERSION" != 8.* ]]; then
            echo "FAIL: expected version starting with 8., got $VERSION"
            exit 1
          fi
          echo "PASS: version $VERSION starts with 8."
