name: Test workloads input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: '8.0'
          workloads: 'wasm-tools'
      - name: Assert dotnet is installed
        env:
          DOTNET_VER: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "dotnet-version output: $DOTNET_VER"
          if ! dotnet --version; then
            echo "FAIL: dotnet not found"
            exit 1
          fi
          echo "PASS: dotnet installed with workloads"
      - name: Assert wasm-tools workload is installed
        run: |
          echo "Listing installed workloads..."
          dotnet workload list
          if dotnet workload list | grep -q 'wasm-tools'; then
            echo "PASS: wasm-tools workload found"
          else
            echo "FAIL: wasm-tools workload not found"
            exit 1
          fi
