name: Test workloads input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dotnet-version: '8.0'
          workloads: 'wasm-tools'
      - name: Assert action ran with workloads input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOTNET_VER: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "dotnet-version: $DOTNET_VER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOTNET_VER" ]; then
              echo "FAIL: action succeeded but dotnet-version output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with workloads input, dotnet-version=$DOTNET_VER"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workload installation may not be supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
