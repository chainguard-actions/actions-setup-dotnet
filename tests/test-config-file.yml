name: Test config-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a custom NuGet.config
        run: |
          mkdir -p hardened/tests/fixtures/nuget
          cat > hardened/tests/fixtures/nuget/NuGet.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF
      - id: action
        uses: .
        with:
          dotnet-version: '8.0'
          config-file: 'hardened/tests/fixtures/nuget/NuGet.config'
      - name: Assert dotnet is installed
        env:
          DOTNET_VER: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "dotnet-version output: $DOTNET_VER"
          if ! dotnet --version; then
            echo "FAIL: dotnet not found"
            exit 1
          fi
          echo "PASS: dotnet installed with custom config-file"
