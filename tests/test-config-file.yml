name: Test config-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4
      - name: Create externals/install-dotnet.sh
        run: |
          mkdir -p __ACTION_SRC__/externals
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o __ACTION_SRC__/externals/install-dotnet.sh
          chmod 755 __ACTION_SRC__/externals/install-dotnet.sh
      - name: Create custom NuGet.config
        run: |
          mkdir -p custom-config
          cat > custom-config/NuGet.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF
          echo "Created custom NuGet.config at custom-config/NuGet.config"
      - id: setup
        uses: .
        with:
          dotnet-version: '8.0.x'
          config-file: custom-config/NuGet.config
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert dotnet is installed
        run: |
          dotnet --version
          echo "PASS: dotnet is available"
