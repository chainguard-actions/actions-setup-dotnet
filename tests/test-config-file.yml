name: Test config-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a NuGet.config fixture
        run: |
          mkdir -p hardened/tests/fixtures
          cat > hardened/tests/fixtures/NuGet.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF
      - id: action
        uses: .
        with:
          dotnet-version: '8.0'
          config-file: 'hardened/tests/fixtures/NuGet.config'
      - name: Assert dotnet-version output is set
        env:
          DOTNET_VER: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "dotnet-version: $DOTNET_VER"
          if [ -z "$DOTNET_VER" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert dotnet is available
        run: |
          dotnet --version
          echo "PASS: dotnet is available"
