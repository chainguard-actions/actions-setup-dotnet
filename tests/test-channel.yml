name: Test latest version with dotnet-channel
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: latest
          dotnet-channel: '8.0'
          skip-lts-prepass: 'true'
      - name: Assert dotnet-version output is from the 8.0 channel
        env:
          ACTUAL: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            8.0.*) echo "PASS" ;;
            *) echo "FAIL: expected an 8.0.x version"; exit 1 ;;
          esac
      - name: Assert SDK is installed
        run: |
          dotnet --list-sdks
          if ! dotnet --list-sdks | grep -q "^8\.0\."; then
            echo "FAIL: no 8.0 SDK listed"
            exit 1
          fi
          echo "PASS"
