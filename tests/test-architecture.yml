name: Test dotnet setup with explicit architecture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dotnet-version: '8.0.x'
          architecture: 'x64'
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output is empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet is installed with x64 architecture
        run: |
          if ! command -v dotnet &>/dev/null; then
            echo "FAIL: dotnet command not found"
            exit 1
          fi
          INSTALLED="$(dotnet --version)"
          echo "dotnet --version: $INSTALLED"
          # Verify the runtime architecture
          ARCH_INFO="$(dotnet --info 2>&1 | grep -i 'architecture' | head -1 || true)"
          echo "Architecture info: $ARCH_INFO"
          if [[ "$INSTALLED" != 8.* ]]; then
            echo "FAIL: expected version starting with 8., got $INSTALLED"
            exit 1
          fi
          echo "PASS: dotnet $INSTALLED installed"
