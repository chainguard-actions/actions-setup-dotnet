name: Test dotnet setup with explicit architecture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create externals/install-dotnet.sh
        run: |
          mkdir -p __ACTION_SRC__/externals
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o __ACTION_SRC__/externals/install-dotnet.sh
          chmod 755 __ACTION_SRC__/externals/install-dotnet.sh
      - id: setup
        uses: .
        with:
          dotnet-version: '8.0.x'
          architecture: 'x64'
      - name: Assert dotnet-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.dotnet-version }}
        run: |
          echo "actual dotnet-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dotnet-version output was empty"
            exit 1
          fi
          echo "PASS: dotnet-version output is set to $ACTUAL"
      - name: Assert dotnet is installed for x64
        run: |
          echo "Checking dotnet is on PATH..."
          which dotnet || { echo "FAIL: dotnet not found on PATH"; exit 1; }
          INSTALLED=$(dotnet --version)
          echo "Installed dotnet version: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: dotnet --version returned empty"
            exit 1
          fi
          # Verify the installed version starts with 8.0
          if [[ "$INSTALLED" != 8.0* ]]; then
            echo "FAIL: expected version starting with 8.0, got $INSTALLED"
            exit 1
          fi
          echo "PASS: dotnet $INSTALLED installed for x64 architecture"
