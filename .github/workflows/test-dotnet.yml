name: Validate dotnet

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
      - releases/*
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  setup-version:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system:
          [
            ubuntu-latest,
            ubuntu-22.04,
            windows-latest,
            macos-15-intel,
            macos-latest
          ]
        dotnet-version: ['8.0', '9.0', '10.0']
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Clear toolcache
        shell: pwsh
        env:
          RUNNER_OS: ${{ runner.os }}
        run: __tests__/clear-toolcache.ps1 $env:RUNNER_OS
      - name: Setup dotnet ${{ matrix.dotnet-version }}
        uses: ./
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Verify installed version
        shell: pwsh
        env:
          DOTNET_VERSION: ${{ matrix.dotnet-version }}
        run: |
          __tests__/verify-dotnet.ps1 -Patterns "^$env:DOTNET_VERSION"
