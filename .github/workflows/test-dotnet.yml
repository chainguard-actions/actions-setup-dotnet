name: Validate dotnet

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
      - releases/*
    paths-ignore:
      - '**.md'

permissions: {}

jobs:
  setup-version:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system:
          [
            ubuntu-latest,
            ubuntu-22.04,
            windows-latest,
            macos-15-intel,
            macos-latest
          ]
        dotnet-version: ['8.0', '9.0', '10.0']
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Clear toolcache
        shell: pwsh
        env:
          RUNNER_OS: ${{ runner.os }}
        run: __tests__/clear-toolcache.ps1 $env:RUNNER_OS
      - name: Setup dotnet ${{ matrix.dotnet-version }}
        uses: ./
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Verify installed version
        shell: pwsh
        env:
          MATRIX_DOTNET_VERSION: ${{ matrix.dotnet-version }}
        run: |
          __tests__/verify-dotnet.ps1 -Patterns "^$env:MATRIX_DOTNET_VERSION"
